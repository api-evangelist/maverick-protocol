name: Maverick Protocol
description: >-
  Maverick Protocol is a decentralized exchange (DEX) and automated market maker
  (AMM) for EVM chains, live on Ethereum, Base, zkSync Era and other networks
  through its dApp at app.mav.xyz. Its Dynamic Distribution AMM lets liquidity
  providers concentrate and automatically shift liquidity as prices move, and its
  veFlywheel and Boosted Positions direct MAV token incentives to pools. The
  core protocol is a set of on-chain V1 and V2 Solidity contracts (Factory,
  Pool, Router, Quoter, PoolLens, position and reward contracts) documented at
  docs.mav.xyz, complemented by a public hosted Data API (v2-api.mav.xyz) that
  returns 24-hour market pricing and volume tickers per chain. Surfaced in the
  API Evangelist network from the Pantera Capital portfolio.
